image: node:18

stages:
  - install
  - build
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

install:
  stage: install
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1h

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - build/
    expire_in: 1d

deploy:
  stage: deploy
  only:
    - main   # ensure your default branch is protected
  script:
    - npm install -g firebase-tools
    - firebase deploy --only hosting --token "$FIREBASE_TOKEN"
